name: table-reservation

services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: table_reservation_php
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - PHP_FPM_PM=dynamic
      - PHP_FPM_PM_MAX_CHILDREN=10
      - PHP_ENV=docker
    networks:
      - table_reservation_network
    depends_on:
      - mysql

  nginx:
    image: nginx:alpine
    container_name: table_reservation_nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - table_reservation_network
    depends_on:
      - php

  mysql:
    image: mysql:8.0
    container_name: table_reservation_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: table_reservation_db
      MYSQL_USER: table_reservation_user
      MYSQL_PASSWORD: table_reservation_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/03-seed.sql
    networks:
      - table_reservation_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: table_reservation_phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
      PMA_DB_ENGINE: mysql
    networks:
      - table_reservation_network
    depends_on:
      - mysql

  recommender:
    image: python:3.12-slim
    container_name: table_reservation_recommender
    profiles: ["recommender"]
    working_dir: /app
    command: sh -c "pip install -q -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8001"
    volumes:
      - ../recommender:/app
    environment:
      DB_HOST: mysql
      DB_NAME: table_reservation_db
      DB_USER: table_reservation_user
      DB_PASSWORD: table_reservation_pass
      RECOMMENDER_SECRET: local-recommender-secret
    ports:
      - "8001:8001"
    networks:
      - table_reservation_network
    depends_on:
      - mysql


networks:
  table_reservation_network:
    driver: bridge

volumes:
  mysql_data:
